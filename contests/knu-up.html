<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 KNU-UP 경진대회 · UB</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../workshops/style.css">
</head>
<body>
<div class="wrap">

<header>
  <h1>2026 KNU-UP 학생 창업아이템 시작품제작 경진대회</h1>
</header>

<figure class="figure poster">
  <a href="./knu-up-poster-original.jpg" target="_blank" rel="noopener">
    <img src="./knu-up-poster.jpg" width="1200" height="1697" alt="2026 KNU-UP 학생 창업아이템 시작품제작 경진대회 포스터">
  </a>
  <figcaption>포스터를 누르면 원본 크기로 볼 수 있습니다.</figcaption>
</figure>

<h2>공고문</h2>

<p><a class="btn" href="./knu-up-notice.pdf" download="2026_KNU-UP_경진대회_공고.pdf">공고문 PDF 다운로드</a></p>

<div id="pdf-pages" class="pdf-pages">
  <p class="pdf-status">공고문을 불러오는 중입니다…</p>
</div>

<footer>
  경북대학교 하드웨어 제작 동아리 UB
</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
(function () {
  var PDF_URL = './knu-up-notice.pdf';
  var CDN = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
  var NARROW = 600;
  var box = document.getElementById('pdf-pages');
  var status = box.querySelector('.pdf-status');

  function fail() {
    status.textContent = '이 브라우저에서는 공고문을 바로 표시하지 못했습니다. 위 버튼으로 PDF를 내려받아 확인해 주세요.';
    if (!status.parentNode) box.appendChild(status);
  }
  if (!window.pdfjsLib) { fail(); return; }

  function boxWidth() {
    return box.clientWidth || document.querySelector('.wrap').clientWidth || window.innerWidth - 36;
  }

  // 흰 여백만 있는 절반은 건너뛴다 (마지막 장 오른쪽 등)
  function isBlank(c) {
    var d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
    for (var i = 0; i < d.length; i += 4 * 23) {
      if (d[i] < 230 || d[i + 1] < 230 || d[i + 2] < 230) return false;
    }
    return true;
  }

  function addCanvas(src, sx, sw, label) {
    var c = document.createElement('canvas');
    c.width = sw; c.height = src.height;
    c.getContext('2d').drawImage(src, sx, 0, sw, src.height, 0, 0, sw, src.height);
    if (isBlank(c)) return;
    c.setAttribute('role', 'img');
    c.setAttribute('aria-label', label);
    box.appendChild(c);
  }

  var pdfDoc = null, renderedNarrow = null, running = false;

  function renderAll() {
    if (running) return;
    running = true;
    var cssWidth = boxWidth();
    var narrow = cssWidth < NARROW;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var sheets = [];
    var chain = Promise.resolve();
    var shown = 0;

    for (var n = 1; n <= pdfDoc.numPages; n++) {
      (function (num) {
        chain = chain.then(function () {
          return pdfDoc.getPage(num).then(function (page) {
            var base = page.getViewport({ scale: 1 });
            var split = narrow && base.width > base.height;
            var target = split ? cssWidth * 2 : cssWidth;
            var vp = page.getViewport({ scale: (target / base.width) * dpr });
            var full = document.createElement('canvas');
            full.width = Math.floor(vp.width);
            full.height = Math.floor(vp.height);
            return page.render({ canvasContext: full.getContext('2d'), viewport: vp }).promise.then(function () {
              sheets.push({ canvas: full, split: split });
            });
          });
        });
      })(n);
    }

    chain.then(function () {
      box.innerHTML = '';
      sheets.forEach(function (s) {
        if (s.split) {
          var half = Math.floor(s.canvas.width / 2);
          addCanvas(s.canvas, 0, half, '공고문 ' + (++shown) + '쪽');
          addCanvas(s.canvas, half, s.canvas.width - half, '공고문 ' + (++shown) + '쪽');
        } else {
          addCanvas(s.canvas, 0, s.canvas.width, '공고문 ' + (++shown) + '쪽');
        }
      });
      renderedNarrow = narrow;
    }).catch(fail).then(function () { running = false; });
  }

  pdfjsLib.GlobalWorkerOptions.workerSrc = CDN + 'build/pdf.worker.min.js';
  pdfjsLib.getDocument({
    url: PDF_URL,
    cMapUrl: CDN + 'cmaps/',
    cMapPacked: true,
    standardFontDataUrl: CDN + 'standard_fonts/'
  }).promise.then(function (pdf) {
    pdfDoc = pdf;
    renderAll();
  }).catch(fail);

  // 화면 폭이 좁음/넓음 경계를 넘을 때만 다시 그림 (회전 등)
  var timer;
  window.addEventListener('resize', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (pdfDoc && renderedNarrow !== null && (boxWidth() < NARROW) !== renderedNarrow) renderAll();
    }, 250);
  });
})();
</script>

</body>
</html>
